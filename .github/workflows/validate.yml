name: Validate repository

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate published portfolio package
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, sys

          root = Path('.')
          failures = []
          required = ['README.md', 'LICENSE', 'CITATION.cff', 'project.json']
          for rel in required:
              p = root / rel
              if not p.exists() or p.stat().st_size == 0:
                  failures.append(f'Missing or empty: {rel}')

          try:
              json.loads((root / 'project.json').read_text(encoding='utf-8'))
          except Exception as exc:
              failures.append(f'Invalid project.json: {exc}')

          for dirname in ['assets', 'data', 'docs', 'reports']:
              d = root / dirname
              if not d.exists() or not any(p.is_file() for p in d.rglob('*')):
                  failures.append(f'Missing public package content: {dirname}/')

          for p in root.rglob('*'):
              if p.is_file() and p.stat().st_size > 95 * 1024 * 1024:
                  failures.append(f'File exceeds 95 MB: {p}')

          if failures:
              print('VALIDATION FAILED')
              for item in failures:
                  print('-', item)
              sys.exit(1)

          print('VALIDATION PASSED')
          print('Northern Nigeria drought public package metadata, data, documentation, reports and assets are present and structurally valid.')
          PY
