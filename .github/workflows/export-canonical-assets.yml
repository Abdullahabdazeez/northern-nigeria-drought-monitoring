name: Export canonical drought assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-canonical-assets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build asset archive
        run: |
          zip -r northern-nigeria-canonical-source.zip README.md CITATION.cff LICENSE project.json assets data docs reports scripts validation 2>/dev/null || zip -r northern-nigeria-canonical-source.zip README.md CITATION.cff LICENSE project.json assets data docs reports
      - uses: actions/upload-artifact@v4
        with:
          name: northern-nigeria-canonical-source
          path: northern-nigeria-canonical-source.zip
          retention-days: 1
